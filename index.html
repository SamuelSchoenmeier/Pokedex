<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>

    <link rel="icon" href="./img/pokedex-logo.png">

    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./downloads/icons.css">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./styles/dialog.css">
    <link rel="stylesheet" href="./styles/colors.css">

    <script src="script.js"></script>
    <script src="./scripts/templates.js"></script>
</head>
<body onload="init()">
    <header>
        <a href="index.html">
            <img class="pokedex-logo" src="./img/pokedex-logo.png" alt="Pokedex">
            <p class="logo-txt">Pokedex</p>
        </a>

        <input id="search_input" type="text" oninput="filterAndShowNames()" placeholder="Search Pokemon" data-id="search-input">
    </header>

    <main data-id="content">
        <h1>Pokedex</h1>
        <div class="dialog-trigger-container" id="trigger_pokemon"></div>

        <dialog id="dialog" onclick="checkBackdropClick(event)" data-id="dialog"></dialog>
    </main>

    <div class="load-more-container" id="trigger">
        <button class="load-more-btn" onclick="loadPokemon()" data-id="load-more-btn">Load More</button>
    </div>

    <footer>
        <img class="da-logo" src="img/DA-logo.png" alt="DA logo">
    </footer>
</body>
</html>
