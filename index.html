<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>

    <link rel="icon" href="./img/pokedex-logo.png">

    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./downloads/icons.css">
    <link rel="stylesheet" href="./styles/loading-spinner.css">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./styles/dialog.css">
    <link rel="stylesheet" href="./styles/colors.css">
    <link rel="stylesheet" href="./styles/responsive-design.css">

    <script src="./scripts/remoteStorage.js"></script>
    <script src="./scripts/dialog.js"></script>
    <script src="script.js"></script>
    <script src="./scripts/templates.js"></script>
</head>

<body onload="init()">

    <header>
        <a href="index.html" aria-label="reload page">
            <img class="pokedex-logo" src="./img/pokedex-logo.png" alt="Pokedex">
            <p class="logo-txt">Pokedex</p>
        </a>

        <form class="filter-container" onsubmit="filterAndShowNames(event)">
            <input id="search_input" type="text" placeholder="Search Pokemon" data-id="search-input">
            <button class="clear-btn" id="clear_btn" onclick="deleteInput()" aria-label="clear search">X</button>

            <button class="filter-btn" id="search_btn" type="submit" aria-label="search pokemon">
                Search
            </button>
        </form>
    </header>

    <main data-id="content">

        <h1>Pokedex</h1>

        <ul class="dialog-trigger-container" id="trigger_pokemon"></ul>

        <dialog id="dialog" onclick="checkBackdropClick(event)" data-id="dialog" aria-labelledby="dialog_title">
            <div id="dialog-content"></div>
            <div class="loading-spinner-container d-none" id="dialog-spinner">
                <div class="loading-spinner"></div>
            </div>
        </dialog>

        <div class="load-more-container" id="trigger">
            <button class="load-more-btn" onclick="loadPokemon()" data-id="load-more-btn" aria-label="load more pokemons">
                Load More
            </button>
    </div>

    </main>

    <div class="loading-spinner-container d-none" id="page-spinner">
        <div class="loading-spinner"></div>
    </div>

    <footer>
        <img class="da-logo" src="img/DA-logo.png" alt="DA logo">
    </footer>

</body>
</html>
